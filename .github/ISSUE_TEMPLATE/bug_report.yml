name: Bug report
description: Something in Orbi doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please check the open issues first in case it's already known.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orbi version or commit
      description: The App Store version, or the commit you built from.
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: iPhone 17 Pro, iOS 26.2
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or logs
      description: Anything else that helps, like the language, text size or theme you use.
